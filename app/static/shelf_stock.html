<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Добавить товар на полку</title>
    <link rel="stylesheet" href="/static/index_style.css">
</head>
<body>
<main>
    <nav aria-label="Разделы склада">
        <a href="/static/index.html">Товар</a>
        <a href="/static/shelf.html">Полка</a>
        <a class="active" href="/static/shelf_stock.html">Товар на полке</a>
    </nav>

    <h1>Добавить товар на полку</h1>
    <form id="shelf-stock-form">
        <label for="barcode">Штрихкод товара</label>
        <input id="barcode" name="barcode" required autocomplete="off" autofocus>

        <label for="shelf-code">Код полки</label>
        <input id="shelf-code" name="shelf_code" required autocomplete="off">

        <label for="quantity">Количество</label>
        <input id="quantity" name="quantity" type="number" min="1" step="1" value="1" required>

        <button type="submit">Добавить</button>
    </form>
    <p id="message" aria-live="polite"></p>
</main>

<script src="/static/shelf_stock.js"></script>
</body>
</html>
